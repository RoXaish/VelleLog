services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vellelog-backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=Velle Log
      - ENV=production
      - DATABASE_URL=sqlite:////app/data/vellelog.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-replace-with-a-random-secret-key-at-least-32-chars-long}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173"]
      - COOKIE_SECURE=false # Set to true when serving behind HTTPS/TLS
      - COOKIE_SAMESITE=lax
    volumes:
      - backend-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vellelog-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
