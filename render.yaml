# Render Blueprint configuration for VelleLog (100% Free Tier)
# https://render.com/docs/blueprint-spec

services:
  # ----------------------------------------------------------------------------
  # Backend API Service (FastAPI + Neon PostgreSQL + Alembic)
  # Free tier on Render: plan: free, no paid persistent disks.
  # Persistent storage is provided by Neon Free PostgreSQL.
  # ----------------------------------------------------------------------------
  - type: web
    name: vellelog-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PROJECT_NAME
        value: Velle Log
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard to your Neon Free PostgreSQL URL (e.g. postgresql://user:pass@ep-xyz.neon.tech/neondb?sslmode=require)
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: CORS_ORIGINS
        sync: false # Set in Render Dashboard to your Vercel URL (e.g. ["https://<your-app>.vercel.app"])
